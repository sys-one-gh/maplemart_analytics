services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # Microsoft does not publish an arm64 SQL Server image; force amd64 so
    # this also runs (via emulation) on Apple Silicon Macs.
    platform: linux/amd64
    container_name: maplemart-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      # Host-side port only - the container always listens on 1433
      # internally. scripts/setup.sh picks the next free host port and
      # writes it to .env as SQLSERVER_PORT if 1433 is already taken.
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./Database:/workspace/Database:ro
      - ./Dataset:/workspace/Dataset:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: maplemart-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  sqlserver-data:
  ollama-data:
